<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">ESP32 to SIM900A UART wiring</title>
  <desc id="desc">Visual wiring diagram showing SIM900A TXD connected to ESP32 GPIO34 RX, SIM900A RXD connected to ESP32 GPIO13 TX, shared ground, and separate modem power.</desc>
  <style>
    .label { font: 600 22px Arial, sans-serif; fill: #172033; }
    .small { font: 18px Arial, sans-serif; fill: #374151; }
    .tiny { font: 16px Arial, sans-serif; fill: #4b5563; }
    .box { stroke: #172033; stroke-width: 3; rx: 18; }
    .pin { stroke: #172033; stroke-width: 2; rx: 8; }
    .wire { fill: none; stroke-width: 7; stroke-linecap: round; }
  </style>
  <rect width="1200" height="760" fill="#f8fafc"/>
  <text x="600" y="48" text-anchor="middle" class="label" font-size="30">SIM900A ↔ ESP32 UART Wiring</text>
  <text x="600" y="78" text-anchor="middle" class="small">For your board: use 3VT and 3VR. Do not use the 5 V or DB9 pins.</text>

  <rect x="80" y="125" width="385" height="445" class="box" fill="#dbeafe"/>
  <text x="272" y="170" text-anchor="middle" class="label" font-size="28">ESP32 Dev Module</text>
  <text x="272" y="198" text-anchor="middle" class="small">Current firmware: UART2</text>

  <rect x="110" y="245" width="310" height="58" class="pin" fill="#bfdbfe"/>
  <text x="130" y="282" class="label">GPIO34</text>
  <text x="405" y="282" text-anchor="end" class="small">RX2 (input only)</text>
  <rect x="110" y="335" width="310" height="58" class="pin" fill="#bfdbfe"/>
  <text x="130" y="372" class="label">GPIO13</text>
  <text x="405" y="372" text-anchor="end" class="small">TX2</text>
  <rect x="110" y="425" width="310" height="58" class="pin" fill="#e5e7eb"/>
  <text x="130" y="462" class="label">GND</text>
  <text x="405" y="462" text-anchor="end" class="small">common ground</text>
  <text x="272" y="530" text-anchor="middle" class="tiny">Do not use TX0/RX0 (GPIO1/GPIO3)</text>

  <rect x="735" y="125" width="385" height="445" class="box" fill="#fee2e2"/>
  <text x="927" y="170" text-anchor="middle" class="label" font-size="28">SIM900A 9-Pin Board</text>
  <text x="927" y="198" text-anchor="middle" class="small">Find these printed labels</text>

  <rect x="765" y="245" width="310" height="58" class="pin" fill="#fecaca"/>
  <text x="785" y="282" class="label">3VT</text>
  <text x="1060" y="282" text-anchor="end" class="small">3.3 V TX output</text>
  <rect x="765" y="335" width="310" height="58" class="pin" fill="#fecaca"/>
  <text x="785" y="372" class="label">3VR</text>
  <text x="1060" y="372" text-anchor="end" class="small">3.3 V RX input</text>
  <rect x="765" y="425" width="310" height="58" class="pin" fill="#e5e7eb"/>
  <text x="785" y="462" class="label">GND</text>
  <text x="1060" y="462" text-anchor="end" class="small">power ground</text>
  <text x="927" y="530" text-anchor="middle" class="tiny">Confirm VCC input voltage from the board manual</text>

  <path d="M420 274 C550 274 650 274 765 274" class="wire" stroke="#2563eb"/>
  <text x="600" y="255" text-anchor="middle" class="small" fill="#2563eb">blue: TXD → RX</text>
  <path d="M420 364 C550 364 650 364 765 364" class="wire" stroke="#dc2626"/>
  <text x="600" y="405" text-anchor="middle" class="small" fill="#dc2626">red: RXD ← TX</text>
  <path d="M420 454 C550 454 650 454 765 454" class="wire" stroke="#111827"/>

  <rect x="80" y="625" width="1040" height="90" rx="16" fill="#fef3c7" stroke="#b45309" stroke-width="3"/>
  <text x="105" y="657" class="label" fill="#92400e">Power and safety</text>
  <text x="105" y="686" class="small">SIM900A VCC → separate 4.0–4.2 V supply capable of about 2 A peak. Connect supply GND to ESP32 GND.</text>
  <text x="105" y="708" class="small">Do not connect 5VR/5VT or DB9-2/DB9-3 to the ESP32. Leave unused control/audio pins disconnected.</text>
</svg>
